[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-optimizer-pytorch"
version = "0.1.0"
description = "A reproducible coordinate-wise LSTM learned optimizer in PyTorch with held-out and OOD validation."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-JORS-Academy-Non-Commercial-1.0"
license-files = ["LICENSE"]
authors = [{name = "Jors Academy"}]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
