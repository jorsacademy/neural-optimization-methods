name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: learned-optimizer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest

  research-smoke:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Meta-train deterministic learned optimizer
        run: >-
          python scripts/train.py
          --seed 42 --episodes 220 --dim 10 --unroll-steps 20 --hidden-size 20
          --out artifacts/learned_optimizer.pt
          --metrics-out artifacts/training_metrics.json
      - name: Benchmark held-out and OOD tasks
        run: >-
          python scripts/benchmark.py
          --model artifacts/learned_optimizer.pt --seed 9000
          --tasks 8 --dim 10 --steps 30
          --output artifacts/benchmark.json
      - uses: actions/upload-artifact@v6
        with:
          name: learned-optimizer-smoke-artifacts
          path: artifacts/*
